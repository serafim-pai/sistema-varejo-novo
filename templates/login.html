<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ 'Criar administrador' if modo == 'primeiro' else 'Entrar no sistema' }}</title>
    <style>
        body { font-family: Arial; margin: 0; background: #fbe9e0; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .caixa { background: #fff; padding: 30px 35px; border-radius: 10px; width: 340px;
                 box-shadow: 0 4px 18px rgba(0,0,0,0.15); border-top: 8px solid #e65100; }
        h1 { color: #e65100; margin: 0 0 6px; font-size: 26px; }
        p.sub { color: #555; margin: 0 0 20px; }
        label { display: block; font-weight: bold; margin: 12px 0 4px; }
        input { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box;
                border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; margin-top: 20px; padding: 12px; font-size: 18px; font-weight: bold;
                 background: #e65100; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #ff8a3d; }
        .erro { background: #f8d7da; color: #721c24; border: 2px solid #f5c2c7;
                padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <form class="caixa" method="post" autocomplete="off" id="formLogin">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if modo == 'primeiro' %}
            <h1>Bem-vindo!</h1>
            <p class="sub">Primeiro acesso: crie o <strong>ADMINISTRADOR MASTER</strong> do sistema.</p>
        {% else %}
            <h1>Entrar</h1>
            <p class="sub">Digite seu e-mail e sua senha.</p>
        {% endif %}

        {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}

        {% if modo == 'primeiro' %}
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" value="{{ nome }}" required autofocus autocomplete="off">
        {% endif %}

        <label for="acesso">E-mail</label>
        <input type="text" id="acesso" name="acesso" value="{{ email }}" required
               autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true"
               {% if modo != 'primeiro' %}autofocus{% endif %}>

        <label for="chave">Senha</label>
        <input type="text" id="chave" required
               autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true"
               {% if modo == 'primeiro' %}placeholder="Pelo menos 6 caracteres"{% endif %}>
        <input type="hidden" name="chave" id="chaveEnvio">

        {% if modo == 'primeiro' %}
            <label for="senha2">Repita a senha</label>
            <input type="text" id="chave2" required
                   autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true">
            <input type="hidden" name="chave2" id="chave2Envio">
            <button type="submit">Criar administrador e entrar</button>
        {% else %}
            <button type="submit">Entrar</button>
        {% endif %}
    </form>
    <script>
        // ---------- CAMPO DE SENHA "SEGURO" ----------
        // A senha é guardada só aqui no código; a caixa mostra apenas bolinhas (•).
        // Como a caixa NÃO é um campo de senha de verdade, o Chrome não oferece
        // e não guarda e-mails e senhas neste computador.
        function campoSenhaSeguro(caixa) {
            let real = '';
            const mostrar = () => { caixa.value = '•'.repeat(real.length); };
            const tudoSelecionado = () => caixa.value.length > 0 &&
                caixa.selectionStart === 0 && caixa.selectionEnd === caixa.value.length;
            caixa.addEventListener('keydown', e => {
                if (e.ctrlKey || e.metaKey || e.altKey) return;       // Ctrl+V etc.
                if (e.key === 'Backspace' || e.key === 'Delete') {
                    e.preventDefault();
                    real = tudoSelecionado() ? '' : real.slice(0, -1);
                } else if (e.key.length === 1) {
                    e.preventDefault();
                    if (tudoSelecionado()) real = '';
                    real += e.key;
                } else {
                    return;                                          // Enter, Tab, setas
                }
                mostrar();
            });
            caixa.addEventListener('paste', e => {
                e.preventDefault();
                real += (e.clipboardData.getData('text') || '').trim();
                mostrar();
            });
            caixa.addEventListener('input', () => {                  // outros jeitos de digitar
                const novos = caixa.value.replace(/•/g, '');
                const bolinhas = caixa.value.length - novos.length;
                real = real.slice(0, bolinhas) + novos;
                mostrar();
            });
            caixa.lerSenha = () => real;
            caixa.limparSenha = () => { real = ''; caixa.value = ''; };
        }

        const chave = document.getElementById('chave');
        const chave2 = document.getElementById('chave2');
        campoSenhaSeguro(chave);
        if (chave2) campoSenhaSeguro(chave2);

        // Na hora de entrar, a senha verdadeira vai num campo escondido
        document.getElementById('formLogin').addEventListener('submit', () => {
            document.getElementById('chaveEnvio').value = chave.lerSenha();
            if (chave2) document.getElementById('chave2Envio').value = chave2.lerSenha();
            chave.value = '';
            if (chave2) chave2.value = '';
        });
    </script>
</body>
</html>
