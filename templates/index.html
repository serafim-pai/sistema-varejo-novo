<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produtos</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        nav a { margin-right: 15px; }
        input, button, select { padding: 8px; margin: 5px; }
        table { border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Produtos</a>
        <a href="/vendas">Vendas</a>
        <a href="/relatorios">Relatórios</a>
    </nav>

    <h1>Cadastro de Produtos</h1>

    <h2>Novo Produto</h2>
    <input type="text" id="nome" placeholder="Nome">
    <input type="number" id="preco" placeholder="Preço" step="0.01">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="text" id="categoria" placeholder="Categoria">
    <button onclick="cadastrarProduto()">Cadastrar</button>

    <h2>Produtos em Estoque</h2>
    <table id="tabelaProdutos"></table>

    <script>
        function carregarProdutos() {
            fetch('/api/produtos')
                .then(r => r.json())
                .then(produtos => {
                    let html = '<tr><th>ID</th><th>Nome</th><th>Preço</th><th>Quantidade</th><th>Categoria</th><th>Ação</th></tr>';
                    produtos.forEach(p => {
                        html += `<tr>
                            <td>${p.id}</td>
                            <td>${p.nome}</td>
                            <td>R$ ${p.preco.toFixed(2)}</td>
                            <td>${p.quantidade}</td>
                            <td>${p.categoria}</td>
                            <td><button onclick="deletarProduto(${p.id})">Excluir</button></td>
                        </tr>`;
                    });
                    document.getElementById('tabelaProdutos').innerHTML = html;
                });
        }

        function cadastrarProduto() {
            const nome = document.getElementById('nome').value;
            const preco = document.getElementById('preco').value;
            const quantidade = document.getElementById('quantidade').value;
            const categoria = document.getElementById('categoria').value;

            fetch('/api/produtos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({nome, preco, quantidade, categoria})
            }).then(r => r.json()).then(res => {
                if (res.sucesso) {
                    alert('Produto cadastrado!');
                    document.getElementById('nome').value = '';
                    document.getElementById('preco').value = '';
                    document.getElementById('quantidade').value = '';
                    document.getElementById('categoria').value = '';
                    carregarProdutos();
                }
            });
        }

        function deletarProduto(id) {
            if (!confirm('Tem certeza que deseja excluir este produto?')) return;
            fetch('/api/produtos/' + id, {method: 'DELETE'})
                .then(r => r.json())
                .then(() => carregarProdutos());
        }

        carregarProdutos();
    </script>
</body>
</html>
