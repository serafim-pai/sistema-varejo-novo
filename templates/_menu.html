{# Menu de cima, igual em todas as telas. Cada tela diz qual é a "pagina" ativa. #}
<style>
    nav { display: flex; align-items: center; flex-wrap: wrap; }
    nav .quem { margin-left: auto; color: #fff; font-size: 15px; font-weight: bold;
                text-shadow: 1px 1px 2px rgba(0,0,0,0.45); }
    nav .quem a { font-size: 15px; padding: 6px 12px; margin: 0 0 0 8px; background: #b33c00; }
    nav .quem .etiqueta { background: #fff; color: #e65100; padding: 2px 8px; border-radius: 10px;
                          font-size: 12px; margin-left: 4px; text-shadow: none; }
</style>
<nav>
    <a href="/" {% if pagina == 'produtos' %}class="ativo"{% endif %}>Produtos</a>
    <a href="/vendas" {% if pagina == 'vendas' %}class="ativo"{% endif %}>Vendas</a>
    <a href="/orcamentos" {% if pagina == 'orcamentos' %}class="ativo"{% endif %}>Orçamentos</a>
    {% if admin %}
    <a href="/relatorios" {% if pagina == 'relatorios' %}class="ativo"{% endif %}>Relatórios</a>
    <a href="/usuarios" {% if pagina == 'usuarios' %}class="ativo"{% endif %}>Usuários</a>
    {% endif %}
    {% if usuario %}
    <span class="quem">
        👤 {{ usuario.nome }}
        <span class="etiqueta">{{ 'ADMINISTRADOR' if admin else 'BALCÃO' }}</span>
        <a href="/sair">Sair</a>
    </span>
    {% endif %}
</nav>
