<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produtos</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        input, button, select { padding: 8px; margin: 5px; }
        table { border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .editando { background: #fff8d6; padding: 10px; border-radius: 5px; }
        #btnCancelar { display: none; }
        .estoque-ok { background: #d4edda; color: #155724; font-weight: bold; }
        .estoque-baixo { background: #fff3cd; color: #856404; font-weight: bold; }
        .estoque-zerado { background: #f8d7da; color: #721c24; font-weight: bold; }
        .legenda span { padding: 4px 8px; margin-right: 8px; border-radius: 4px; font-size: 14px; }
        nav { background: #e65100; padding: 12px 15px; border-radius: 6px; margin-bottom: 15px; }
        nav a { color: #ffffff; font-weight: 900; font-size: 20px; text-decoration: none;
                letter-spacing: 0.5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.45);
                padding: 8px 16px; margin-right: 8px; border-radius: 5px; display: inline-block; }
        nav a:hover { background: #ff8a3d; }
        nav a.ativo { background: #ffffff; color: #e65100; }
        .aviso { border-radius: 6px; padding: 12px 16px; margin: 10px 0 15px; font-size: 16px; }
        .aviso-alerta { background: #fff3cd; border: 2px solid #ffc107; color: #5c4400; }
        .aviso-ok { background: #d4edda; border: 2px solid #28a745; color: #155724; }
        .aviso ul { margin: 6px 0 0; padding-left: 22px; }
        .btn-entrada { background: #28a745; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="ativo">Produtos</a>
        <a href="/vendas">Vendas</a>
        <a href="/relatorios">Relatórios</a>
    </nav>

    <h1>Cadastro de Produtos</h1>

    <!-- Aviso de produtos com estoque baixo ou zerado -->
    <div id="avisoEstoque" class="aviso"></div>

    <div id="formulario">
        <h2 id="tituloFormulario">Novo Produto</h2>
        <input type="text" id="nome" placeholder="Nome">
        <input type="number" id="preco" placeholder="Preço" step="0.01">
        <input type="number" id="quantidade" placeholder="Quantidade">
        <input type="text" id="categoria" placeholder="Categoria">
        <select id="unidade" title="Unidade de medida"></select>
        <button id="btnSalvar" onclick="salvarProduto()">Cadastrar</button>
        <button id="btnCancelar" onclick="cancelarEdicao()">Cancelar</button>
    </div>

    <h2>Produtos em Estoque</h2>
    <p class="legenda">
        <span class="estoque-ok">Verde: estoque bom (10 ou mais)</span>
        <span class="estoque-baixo">Amarelo: estoque baixo (1 a 9)</span>
        <span class="estoque-zerado">🔴 Vermelho: sem estoque (0)</span>
    </p>
    <table id="tabelaProdutos"></table>

    <script>
        // Texto da quantidade: com bolinha vermelha quando o estoque zerar
        function textoQuantidade(quantidade) {
            if (quantidade <= 0) return '🔴 0 (SEM ESTOQUE)';
            return quantidade;
        }

        // Escolhe a cor da quantidade: verde, amarelo ou vermelho
        function corEstoque(quantidade) {
            if (quantidade <= 0) return 'estoque-zerado';
            if (quantidade < 10) return 'estoque-baixo';
            return 'estoque-ok';
        }

        // Guarda o ID do produto que está sendo editado (null = cadastrando um novo)
        let idEmEdicao = null;
        let listaProdutos = [];

        function carregarProdutos() {
            fetch('/api/produtos')
                .then(r => r.json())
                .then(produtos => {
                    listaProdutos = produtos;
                    let html = '<tr><th>ID</th><th>Nome</th><th>Preço</th><th>Quantidade</th><th>Unidade</th><th>Categoria</th><th>Ações</th></tr>';
                    produtos.forEach(p => {
                        html += `<tr>
                            <td>${p.id}</td>
                            <td>${p.nome}</td>
                            <td>R$ ${p.preco.toFixed(2)}</td>
                            <td class="${corEstoque(p.quantidade)}">${textoQuantidade(p.quantidade)}</td>
                            <td>${p.unidade}</td>
                            <td>${p.categoria}</td>
                            <td>
                                <button class="btn-entrada" onclick="entradaEstoque(${p.id})">+ Entrada</button>
                                <button onclick="editarProduto(${p.id})">Editar</button>
                                <button onclick="deletarProduto(${p.id})">Excluir</button>
                            </td>
                        </tr>`;
                    });
                    document.getElementById('tabelaProdutos').innerHTML = html;
                    mostrarAviso(produtos);
                });
        }

        function limparFormulario() {
            document.getElementById('nome').value = '';
            document.getElementById('preco').value = '';
            document.getElementById('quantidade').value = '';
            document.getElementById('categoria').value = '';
            document.getElementById('unidade').value = 'UN';
        }

        // Clicou em "Editar": coloca os dados do produto no formulário
        function editarProduto(id) {
            const p = listaProdutos.find(item => item.id === id);
            if (!p) return;

            idEmEdicao = id;
            document.getElementById('nome').value = p.nome;
            document.getElementById('preco').value = p.preco;
            document.getElementById('quantidade').value = p.quantidade;
            document.getElementById('categoria').value = p.categoria;
            document.getElementById('unidade').value = p.unidade;

            document.getElementById('tituloFormulario').textContent = 'Editando: ' + p.nome;
            document.getElementById('btnSalvar').textContent = 'Salvar alterações';
            document.getElementById('btnCancelar').style.display = 'inline-block';
            document.getElementById('formulario').classList.add('editando');
            window.scrollTo(0, 0);
        }

        // Clicou em "Cancelar": volta ao modo de cadastro
        function cancelarEdicao() {
            idEmEdicao = null;
            limparFormulario();
            document.getElementById('tituloFormulario').textContent = 'Novo Produto';
            document.getElementById('btnSalvar').textContent = 'Cadastrar';
            document.getElementById('btnCancelar').style.display = 'none';
            document.getElementById('formulario').classList.remove('editando');
        }

        // Clicou em "Cadastrar" ou "Salvar alterações"
        function salvarProduto() {
            const dados = {
                nome: document.getElementById('nome').value,
                preco: document.getElementById('preco').value,
                quantidade: document.getElementById('quantidade').value,
                categoria: document.getElementById('categoria').value,
                unidade: document.getElementById('unidade').value
            };

            const editando = idEmEdicao !== null;
            const url = editando ? '/api/produtos/' + idEmEdicao : '/api/produtos';
            const metodo = editando ? 'PUT' : 'POST';

            fetch(url, {
                method: metodo,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            }).then(r => r.json()).then(res => {
                if (res.sucesso) {
                    alert(editando ? 'Produto atualizado!' : 'Produto cadastrado!');
                    cancelarEdicao();
                    carregarProdutos();
                } else {
                    alert(res.mensagem);
                }
            });
        }

        function deletarProduto(id) {
            if (!confirm('Tem certeza que deseja excluir este produto?')) return;
            fetch('/api/produtos/' + id, {method: 'DELETE'})
                .then(r => r.json())
                .then(() => carregarProdutos());
        }

        // Mostra no alto da tela os produtos que precisam de reposição
        function mostrarAviso(produtos) {
            const aviso = document.getElementById('avisoEstoque');
            const zerados = produtos.filter(p => p.quantidade <= 0);
            const baixos = produtos.filter(p => p.quantidade > 0 && p.quantidade < 10);

            if (zerados.length === 0 && baixos.length === 0) {
                aviso.className = 'aviso aviso-ok';
                aviso.innerHTML = '🟢 <strong>Estoque em dia!</strong> Nenhum produto precisa de reposição.';
                return;
            }

            let html = '⚠️ <strong>Atenção: produtos para repor</strong><ul>';
            zerados.forEach(p => { html += `<li>🔴 <strong>${p.nome}</strong>: SEM ESTOQUE</li>`; });
            baixos.forEach(p => { html += `<li>🟡 <strong>${p.nome}</strong>: só ${p.quantidade} ${p.unidade}</li>`; });
            html += '</ul>';
            aviso.className = 'aviso aviso-alerta';
            aviso.innerHTML = html;
        }

        // Clicou em "+ Entrada": pergunta quanto chegou e soma ao estoque
        function entradaEstoque(id) {
            const p = listaProdutos.find(item => item.id === id);
            if (!p) return;

            const resposta = prompt(`Entrada de estoque: ${p.nome}\nEstoque atual: ${p.quantidade} ${p.unidade}\n\nQuantos(as) ${p.unidade} chegaram?`);
            if (resposta === null) return;   // clicou em Cancelar

            fetch('/api/produtos/' + id + '/entrada', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({quantidade: resposta})
            }).then(r => r.json()).then(res => {
                if (res.sucesso) {
                    alert(`Entrada registrada! ${res.nome} agora tem ${res.novo_total} ${p.unidade}`);
                    carregarProdutos();
                } else {
                    alert(res.mensagem);
                }
            });
        }

        // Tecla Enter nos campos do formulário = clicar em Cadastrar / Salvar
        // Carrega a lista de unidades de medida no campo de escolha
        fetch('/api/unidades')
            .then(r => r.json())
            .then(unidades => {
                document.getElementById('unidade').innerHTML =
                    unidades.map(u => `<option value="${u}">${u}</option>`).join('');
            });

        ['nome', 'preco', 'quantidade', 'categoria'].forEach(campo => {
            document.getElementById(campo).addEventListener('keydown', evento => {
                if (evento.key === 'Enter') salvarProduto();
            });
        });

        carregarProdutos();
    </script>
</body>
</html>
